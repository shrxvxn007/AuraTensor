name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Build & test (JDK ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        java: [ '25' ]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Show JDK version
        run: java -version

      - name: Build & test with mvnw
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp clean test

      - name: Build shaded jar
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp -DskipTests package

      - name: Verify shaded jar is runnable
        run: |
          java --add-modules jdk.incubator.vector \
               --enable-native-access=ALL-UNNAMED \
               -jar target/auratensor.jar --help || true

  benchmark-compile:
    runs-on: ubuntu-latest
    name: Compile JMH benchmarks (no execution)
    needs: test
    strategy:
      fail-fast: false
      matrix:
        java: [ '25' ]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Compile benchmarks
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp test-compile
